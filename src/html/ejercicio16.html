<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma de Rango</title>
</head>
<body>

<script>
const sumarRango = (inicio, fin) => {
    let suma = 0;

    for (let i = inicio; i <= fin; i++) {
        suma += i;
    }

    return suma;
};

const inicio = parseInt(prompt("Ingrese el número inicial:"));
const fin = parseInt(prompt("Ingrese el número final:"));

const resultado = inicio <= fin
    ? sumarRango(inicio, fin)
    : "Error: el número inicial debe ser menor o igual al final";

document.body.innerHTML = `<h2>Resultado: ${resultado}</h2>`;
</script>

</body>
</html>
