<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Países y Capitales</title>
    <link rel="stylesheet" href="../../assets/css/ejercicio21.css">
</head>
<body>

    <div class="container">
        <h2>Geografía de América</h2>
        
        <div class="form-group">
            <label for="paises">Selecciona un País:</label>
            <select id="paises">
                <option value="" disabled selected>-- Elige un país --</option>
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="canada">Canadá</option>
                <option value="chile">Chile</option>
                <option value="mexico">México</option>
                <option value="peru">Perú</option>
            </select>
        </div>

        <div class="form-group">
            <label for="capitales">Capital correspondiente:</label>
            <select id="capitales" disabled>
                <option value="" disabled selected>-- Capital --</option>
                <option value="argentina">Buenos Aires</option>
                <option value="brasil">Brasilia</option>
                <option value="canada">Ottawa</option>
                <option value="chile">Santiago</option>
                <option value="mexico">Ciudad de México</option>
                <option value="peru">Lima</option>
            </select>
        </div>
    </div>

    <script src="../js/ejercicio21.js"></script>
</body>
</html>
