<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 20</title>
    <link rel="stylesheet" href="/assets/css/ejercicio20.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Registro</h1>
            <p class="subtitle">Complete los datos</p>

            <form id="form-carga">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese su Nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ingrese su Apellido" required>
                </div>

                <div class="form-group">
                    <label for="lu">Libreta Universitaria</label>
                    <input type="text" id="lu" placeholder="Ingrese su Libreta Universitaria" required>
                </div>
                <button type="submit" id="btn-procesar">Registrar Estudiante</button>
            </form>
            <section id="resultado" class="display-area"> </section>
        </section>
    </main>
    <script type="module" src="../js/ejercicio20.js"></script>
</body>
</html>
