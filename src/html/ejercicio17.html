<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio_17</title>
</head>
<body>
    <script>
        function contarLetraA(texto){
            let contador = 0;
            for (let i = 0; i < texto.length; i++) {
                if (texto[i] === "a") {
                    contador++;
                }
            }
            return contador;
        }
        let palabra = prompt("Ingrese un texto: ");
        let resultado = contarLetraA(palabra);

        document.write(`Texto: ${palabra}<br>`);
        document.write(`Cantidad de 'a': ${resultado}`);
    </script>
</body>
</html>
